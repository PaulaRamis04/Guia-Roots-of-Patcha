<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3E6D0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2E241D" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Guía no oficial de Roots of Pacha: cultivos, aldeanos, regalos, calendario, recetas, ideas, minerales, herramientas, pesca, animales y profecías.">
  <title>Guía Pacha</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/grandstander.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    /* Aplica el tema guardado antes de pintar, para no ver un destello claro en modo oscuro */
    try {
      var st = JSON.parse(localStorage.getItem('pacha-guia-v1') || '{}');
      var dark = st.theme === 'dark' || ((!st.theme || st.theme === 'auto') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { /* sin almacenamiento */ }
    /* Si algo falla al arrancar, que se vea un mensaje en vez de una pantalla vacía */
    window.__pachaErrors = [];
    window.addEventListener('error', function (e) { window.__pachaErrors.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : '')); });
  </script>
</head>
<body>
  <!-- Iconos propios, estilo pintura rupestre: trazo grueso y redondeado -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-hand" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="7"><path d="M22.5 33V13.5"/><path d="M31.5 30V9"/><path d="M40.5 31V12"/><path d="M49 36V20.5"/><path d="M14.5 39.5L9.5 29"/></g>
      <path fill="currentColor" stroke="none" d="M15 37.5c0-4.5 3.2-7 7.5-7h21c5 0 8.5 3 8.5 8.5C52 50 44.5 58 34 58S15 50 15 40.5z"/>
    </symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 2.8c2.2 3 5.2 5.2 5.2 9.3a5.2 5.2 0 0 1-10.4 0c0-2 1-3.5 2.1-4.6.1 1.9 1 3 2.1 3.2-1-2.3-.4-5.2 1-7.9z"/><path d="M4 21.2l16-3.1M20 21.2L4 18.1"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M14.5 3.2a6.6 6.6 0 1 0 5.6 9.8 5.4 5.4 0 0 1-5.6-9.8z"/><path d="M5 21v-3.4M8.5 21v-3.4M12 21v-3.4M15.5 21v-3.4M3.8 20.2l12.8-2"/></symbol>
    <symbol id="i-sprout" viewBox="0 0 24 24"><path d="M12 19.5v-8"/><path d="M12 11.5c0-4 2.9-6.6 7-6.6 0 4-2.9 6.6-7 6.6z"/><path d="M12 14c0-3-2.5-5.2-6-5.2 0 3.1 2.5 5.2 6 5.2z"/><path d="M4.5 21c2.1-1.4 4.6-2.1 7.5-2.1s5.4.7 7.5 2.1"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="7.5" cy="4.8" r="2.1"/><path d="M7.5 8.2v6.2M7.5 14.4l-2.6 6M7.5 14.4l2.6 6M3.6 9.8l3.9.6 3.9-.6"/><circle cx="16.8" cy="6.4" r="1.9"/><path d="M16.8 9.4v5.2M16.8 14.6l-2.2 5.6M16.8 14.6l2.2 5.6M13.4 11.2l3.4.3 3.4-.3"/></symbol>
    <symbol id="i-basket" viewBox="0 0 24 24"><path d="M3.8 10.2h16.4l-2.1 9.6H5.9z"/><path d="M7.8 10.2c0-3.1 1.9-5.3 4.2-5.3s4.2 2.2 4.2 5.3"/><path d="M5 13.6h14M5.7 16.8h12.6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"/><path d="M20 20l-4.3-4.3"/></symbol>
  </svg>

  <header class="topbar">
    <button class="icon-btn back" id="backBtn" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="topbar-title">
      <h1 id="pageTitle">Guía Pacha</h1>
      <span class="subtitle" id="eyebrow"></span>
    </div>
    <button class="date-pill" id="datePill" aria-label="Cambiar día del juego"></button>
    <button class="icon-btn" id="searchBtn" aria-label="Buscar en toda la guía" aria-keyshortcuts="/ Control+K">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1">
    <div class="loader" role="status">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <g fill="none" stroke-linecap="round" stroke-width="7" style="stroke:var(--ink-2)"><path d="M18 84l60-12"/><path d="M78 84L18 72"/></g>
        <path class="flicker" style="fill:var(--ochre-red)" d="M48 14c9 12 20 20 20 37a20 20 0 0 1-40 0c0-8 4-14 8-18 .4 7 4 11 8 12-4-9-2-20 4-31z"/>
        <path class="flicker b" style="fill:var(--ochre-yellow)" d="M48 40c4 5 9 9 9 16a9 9 0 0 1-18 0c0-4 2-6 4-8 0 3 2 5 4 5-1-4 0-9 1-13z"/>
      </svg>
      <span>Avivando la hoguera…</span>
    </div>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#/hoy" data-tab="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-fire"/></svg><span>Hoy</span></a>
    <a href="#/calendario" data-tab="calendario"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg><span>Calendario</span></a>
    <a href="#/cultivos" data-tab="cultivos"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sprout"/></svg><span>Cultivos</span></a>
    <a href="#/aldeanos" data-tab="aldeanos"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-people"/></svg><span>Aldeanos</span></a>
    <a href="#/mas" data-tab="mas"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-basket"/></svg><span>Más</span></a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheetContent"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data-extra.js"></script>
  <script src="js/data-proc.js"></script>
  <script src="js/data-groups.js"></script>
  <script src="js/img-index.js"></script>
  <script src="js/images.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* Estado de error: si la app no ha llegado a arrancar, explicarlo con calma */
    if (!window.__pachaReady) {
      document.getElementById('view').innerHTML =
        '<div class="card error-card" role="alert"><h3>No se ha podido encender la hoguera</h3>' +
        '<p class="small">La guía no ha terminado de cargar. Prueba a recargar; si sigue pasando, reinstala la app.</p>' +
        '<button class="btn primary" onclick="location.reload()">Recargar</button>' +
        (window.__pachaErrors.length ? '<pre>' + window.__pachaErrors.join('\n').replace(/[<&]/g, '') + '</pre>' : '') + '</div>';
    }
  </script>
</body>
</html>
