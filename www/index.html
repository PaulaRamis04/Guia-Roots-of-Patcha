<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ecdf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1713" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Guía no oficial de Roots of Pacha: cultivos, aldeanos, regalos, calendario, pesca, animales y profecías.">
  <title>Guía Pacha</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn back" id="backBtn" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="topbar-title">
      <span class="eyebrow" id="eyebrow">Guía no oficial</span>
      <h1 id="pageTitle">Hoy</h1>
    </div>
    <button class="date-pill" id="datePill" aria-label="Cambiar día del juego"></button>
    <button class="icon-btn" id="searchBtn" aria-label="Buscar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#/hoy" data-tab="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg><span>Hoy</span></a>
    <a href="#/calendario" data-tab="calendario"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendario</span></a>
    <a href="#/cultivos" data-tab="cultivos"><svg viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 7.5-7.5C19 9 16 12 12 12z"/><path d="M12 15c0-3.3-2.5-5.8-6.5-6.2.5 3.6 3 6.2 6.5 6.2z"/></svg><span>Cultivos</span></a>
    <a href="#/aldeanos" data-tab="aldeanos"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.8 6.5-5.8s5.9 2.2 6.5 5.8"/><circle cx="17.5" cy="9.5" r="2.6"/><path d="M16.8 14.4c2.6.2 4.3 2 4.7 4.9"/></svg><span>Aldeanos</span></a>
    <a href="#/mas" data-tab="mas"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg><span>Más</span></a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/images.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
